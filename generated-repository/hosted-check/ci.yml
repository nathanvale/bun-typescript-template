name: Hosted check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Changesets
        if: github.event_name == 'pull_request'
        run: bun run check:changesets
      - name: Check Fallow recorded hits did not grow
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "${BASE:-}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            if [ "${EVENT_NAME:-}" = "push" ]; then
              echo "::notice::Skipping Fallow recorded-hits growth check: no earlier commit to compare (${BASE:-empty})."
              exit 0
            fi
            echo "::error::Fallow recorded-hits growth check cannot run: base commit '${BASE:-empty}' is missing from this checkout. Check out with fetch-depth: 0, then rerun the job."
            exit 1
          fi
          bun run --silent quality:fallow -- --fail-on-baseline-growth --baseline-base "$BASE"
          bun scripts/check-recorded-health-sizes.ts --base "$BASE"
